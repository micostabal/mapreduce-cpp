syntax = "proto3";

package mapreduce.master;

service MasterService {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc RegisterWorker(RegisterRequest) returns (RegisterResponse);
  rpc HandleFinishedMapTask(HandleFinishedMapTaskRequest) returns (HandleFinishedMapTaskResponse);
}

message RegisterRequest {
  string address = 1;
}

message RegisterResponse {
  int32 worker_id = 1;
}

message HeartbeatRequest {
  int32 worker_id = 1;
}

message HeartbeatResponse {
  bool ok = 1;
}

message HandleFinishedMapTaskRequest {
  int32 worker_id = 1;
  int32 task_id = 2;
  repeated string results = 3;
}

message HandleFinishedMapTaskResponse {
  bool ok = 1;
}
